# DevKit workflow manifest (canonical YAML; same schema as setup/workflows/*.json)
# id: phase.spec-clarity

id: phase.spec-clarity
version: 1.0.0
kind: atomic
title: Phase — Spec clarity & handoff
description: Resolve open questions until requirements are decision-ready for planning; record a
  formal handoff marker. No PLAN.md and no production code in this phase.
steps:
  - id: clarify_until_clear
    title: Clarify until spec is clear
    skill_id: phase.ingest.read-sources
    mcp_tools:
      - get_task_context
    notes: One question per message when possible; update .vibe/research/<task-id>.md with concrete AC
      language, scope boundaries, confirmed constraints, and unresolved questions. Do not create
      PLAN.md.
  - id: spec_ready_handoff
    title: Confirm spec ready (hand off to planning)
    skill_id: phase.spec.handoff
    requires_user_approval: true
    notes: 'When AC and scope are clear: add the exact phrase "Spec ready for PLAN" to
      .vibe/research/<task-id>.md (e.g. under Decision log). Quality gate before approve: required
      research sections exist and are non-empty enough for planning. Next session: kaopiz-devkit
      start <task-id> --skill feature_dev or full_task_with_ingest (or your team router to default /
      with-ingest).'
    verify_commands:
      - "node -e \"const fs=require('fs'),path=require('path');const root=process.cwd();const
        active=path.join(root,'.vibe','active.json');const
        legacy=path.join(root,'.vibe','state.json');let st;if(fs.existsSync(active)){const
        p=JSON.parse(fs.readFileSync(active,'utf8'));const seg=p.session_segment;if(!seg||typeof
        seg!=='string'){console.error('Invalid .vibe/active.json');process.exit(1);}const
        sp=path.join(root,'.vibe','sessions',seg,'state.json');if(!fs.existsSync(sp)){console.error\
        ('Missing session state:
        '+sp);process.exit(1);}st=JSON.parse(fs.readFileSync(sp,'utf8'));}else
        if(fs.existsSync(legacy)){st=JSON.parse(fs.readFileSync(legacy,'utf8'));}else{console.error\
        ('No Vibe state: expected .vibe/active.json + .vibe/sessions/<segment>/state.json, or legacy
        .vibe/state.json');process.exit(1);}const
        id=String(st.task_id||'').replace(/[^a-zA-Z0-9._-]+/g,'_');const
        f=path.join(root,'.vibe/research',id+'.md');if(!fs.existsSync(f)){console.error('Missing
        research file: '+f);process.exit(1);}const b=fs.readFileSync(f,'utf8');if(!/Spec ready for
        PLAN/i.test(b)){console.error('Add the exact phrase Spec ready for PLAN to the research file
        when the spec is clear.');process.exit(1);}\""
      - "node -e \"const fs=require('fs'),path=require('path');const root=process.cwd();const
        active=path.join(root,'.vibe','active.json');const
        legacy=path.join(root,'.vibe','state.json');let st;if(fs.existsSync(active)){const
        p=JSON.parse(fs.readFileSync(active,'utf8'));const seg=p.session_segment;if(!seg||typeof
        seg!=='string'){console.error('Invalid .vibe/active.json');process.exit(1);}const
        sp=path.join(root,'.vibe','sessions',seg,'state.json');if(!fs.existsSync(sp)){console.error\
        ('Missing session state:
        '+sp);process.exit(1);}st=JSON.parse(fs.readFileSync(sp,'utf8'));}else
        if(fs.existsSync(legacy)){st=JSON.parse(fs.readFileSync(legacy,'utf8'));}else{console.error\
        ('No Vibe state: expected .vibe/active.json + .vibe/sessions/<segment>/state.json, or legacy
        .vibe/state.json');process.exit(1);}const
        id=String(st.task_id||'').replace(/[^a-zA-Z0-9._-]+/g,'_');const
        f=path.join(root,'.vibe/research',id+'.md');if(!fs.existsSync(f)){console.error('Missing
        research file: '+f);process.exit(1);}const b=fs.readFileSync(f,'utf8');const
        required=['Sources','Spec snapshot','Confirmed vs Assumptions','In scope / Out of
        scope','Ambiguities & questions'];const missing=required.filter((h)=>!new
        RegExp('^#{1,6}\\\\s*'+h+'\\\\s*$','im').test(b));if(missing.length){console.error('Research
        file missing required sections: '+missing.join(', '));process.exit(1);}const core=['Spec
        snapshot','Confirmed vs Assumptions','In scope / Out of scope'];const
        tooThin=core.filter((h)=>{const re=new
        RegExp('^#{1,6}\\\\s*'+h+'\\\\s*$([\\\\s\\\\S]*?)(?=^#{1,6}\\\\s+|$)','im');const
        m=b.match(re);if(!m)return true;const
        text=String(m[1]||'').replace(/[`>*_\\-\\s]/g,'');return
        text.length<30;});if(tooThin.length){console.error('Research sections are too thin for
        planning: '+tooThin.join(', '));process.exit(1);}\""
