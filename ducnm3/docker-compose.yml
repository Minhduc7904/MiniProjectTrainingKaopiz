x-messaging-environment: &messaging-environment
  Messaging__RabbitMq__Host: rabbitmq
  Messaging__RabbitMq__Port: 5672
  Messaging__RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}
  Messaging__RabbitMq__Username: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
  Messaging__RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
  Messaging__Retry__RetryCount: ${MESSAGING_RETRY_COUNT:-3}
  Messaging__Retry__InitialIntervalSeconds: ${MESSAGING_RETRY_INITIAL_INTERVAL_SECONDS:-1}
  Messaging__Retry__IntervalIncrementSeconds: ${MESSAGING_RETRY_INTERVAL_INCREMENT_SECONDS:-2}
  Messaging__Consumer__PrefetchCount: ${MESSAGING_PREFETCH_COUNT:-32}
  Messaging__Consumer__ConcurrencyLimit: ${MESSAGING_CONCURRENCY_LIMIT:-8}
  Messaging__Host__StartTimeoutSeconds: ${MESSAGING_HOST_START_TIMEOUT_SECONDS:-30}
  Messaging__Host__StopTimeoutSeconds: ${MESSAGING_HOST_STOP_TIMEOUT_SECONDS:-30}

x-http-query-environment: &http-query-environment
  Communication__HttpQuery__TimeoutSeconds: ${HTTP_QUERY_TIMEOUT_SECONDS:-5}
  Communication__HttpQuery__RetryCount: ${HTTP_QUERY_RETRY_COUNT:-3}
  Communication__HttpQuery__RetryDelayMilliseconds: ${HTTP_QUERY_RETRY_DELAY_MILLISECONDS:-200}

x-observability-environment: &observability-environment
  Observability__Seq__ServerUrl: http://seq:5341

services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  mysql-init:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      COURSE_DB_NAME: ${COURSE_DB_NAME:?COURSE_DB_NAME must be set}
      COURSE_DB_USER: ${COURSE_DB_USER:?COURSE_DB_USER must be set}
      COURSE_DB_PASSWORD: ${COURSE_DB_PASSWORD:?COURSE_DB_PASSWORD must be set}
      STUDENT_DB_NAME: ${STUDENT_DB_NAME:?STUDENT_DB_NAME must be set}
      STUDENT_DB_USER: ${STUDENT_DB_USER:?STUDENT_DB_USER must be set}
      STUDENT_DB_PASSWORD: ${STUDENT_DB_PASSWORD:?STUDENT_DB_PASSWORD must be set}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:?MEDIA_DB_NAME must be set}
      MEDIA_DB_USER: ${MEDIA_DB_USER:?MEDIA_DB_USER must be set}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?MEDIA_DB_PASSWORD must be set}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:?NOTIFICATION_DB_NAME must be set}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?NOTIFICATION_DB_USER must be set}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set}
      SCHEDULER_DB_NAME: ${SCHEDULER_DB_NAME:?SCHEDULER_DB_NAME must be set}
      SCHEDULER_DB_USER: ${SCHEDULER_DB_USER:?SCHEDULER_DB_USER must be set}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?SCHEDULER_DB_PASSWORD must be set}
    volumes:
      - ./scripts/database/bootstrap/init-databases.sh:/bootstrap/init-databases.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap/init-databases.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "${OBSERVABILITY_SEQ_UI_PORT:-8081}:80"
    volumes:
      - seq-data:/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY must be set}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY must be set}
      MINIO_IMAGE_BUCKET: ${MINIO_IMAGE_BUCKET:-images}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET:-videos}
      MINIO_DOCUMENT_BUCKET: ${MINIO_DOCUMENT_BUCKET:-documents}
      MINIO_AUDIO_BUCKET: ${MINIO_AUDIO_BUCKET:-audios}
      MINIO_OTHER_BUCKET: ${MINIO_OTHER_BUCKET:-other}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    volumes:
      - ./scripts/storage/minio/init-media-storage.sh:/bootstrap/init-media-storage.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap/init-media-storage.sh"]
    restart: "no"

  course-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Course/CourseService.Api/CourseService.Api.csproj
    command: CourseService.Api.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *http-query-environment, *observability-environment]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      ConnectionStrings__Database: ${COURSE_DB_CONNECTION_STRING:?COURSE_DB_CONNECTION_STRING must be set}
      ServiceEndpoints__student-service: http://student-service:8080/
      ServiceEndpoints__media-service: http://media-service:8080/
    ports:
      - "5101:8080"

  student-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Student/StudentService.Api/StudentService.Api.csproj
    command: StudentService.Api.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *observability-environment]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      ConnectionStrings__Database: ${STUDENT_DB_CONNECTION_STRING:?STUDENT_DB_CONNECTION_STRING must be set}
    ports:
      - "5102:8080"

  media-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Media/MediaService.Api/MediaService.Api.csproj
    command: MediaService.Api.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      admin-service:
        condition: service_started
    environment:
      <<: [*messaging-environment, *http-query-environment, *observability-environment]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      ConnectionStrings__Database: ${MEDIA_DB_CONNECTION_STRING:?MEDIA_DB_CONNECTION_STRING must be set}
      Storage__Minio__Endpoint: minio:9000
      Storage__Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      Storage__Minio__AccessKey: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY must be set}
      Storage__Minio__SecretKey: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY must be set}
      Storage__Minio__UseSsl: ${MINIO_USE_SSL:-false}
      Storage__Minio__PublicUseSsl: ${MINIO_PUBLIC_USE_SSL:-false}
      Storage__Minio__UploadPresignExpirySeconds: ${MEDIA_UPLOAD_PRESIGN_EXPIRY_SECONDS:-900}
      Storage__Minio__ImageBucket: ${MINIO_IMAGE_BUCKET:-images}
      Storage__Minio__VideoBucket: ${MINIO_VIDEO_BUCKET:-videos}
      Storage__Minio__DocumentBucket: ${MINIO_DOCUMENT_BUCKET:-documents}
      Storage__Minio__AudioBucket: ${MINIO_AUDIO_BUCKET:-audios}
      Storage__Minio__OtherBucket: ${MINIO_OTHER_BUCKET:-other}
      Storage__Minio__HealthTimeoutSeconds: ${MINIO_HEALTH_TIMEOUT_SECONDS:-3}
      MediaUpload__ImageMaxBytes: ${MEDIA_UPLOAD_IMAGE_MAX_BYTES:-10485760}
      MediaUpload__VideoMaxBytes: ${MEDIA_UPLOAD_VIDEO_MAX_BYTES:-524288000}
      MediaUpload__DocumentMaxBytes: ${MEDIA_UPLOAD_DOCUMENT_MAX_BYTES:-52428800}
      MediaUpload__AudioMaxBytes: ${MEDIA_UPLOAD_AUDIO_MAX_BYTES:-104857600}
      MediaUpload__OtherMaxBytes: ${MEDIA_UPLOAD_OTHER_MAX_BYTES:-26214400}
      MediaUpload__RequestMaxBytes: ${MEDIA_UPLOAD_REQUEST_MAX_BYTES:-550502400}
      ServiceEndpoints__student-service: http://student-service:8080/
      ServiceEndpoints__admin-service: http://admin-service:8080/
    ports:
      - "5103:8080"

  media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Media/MediaService.Worker/MediaService.Worker.csproj
    command: MediaService.Worker.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *http-query-environment, *observability-environment]
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: ${MEDIA_DB_CONNECTION_STRING:?MEDIA_DB_CONNECTION_STRING must be set}
      Storage__Minio__Endpoint: minio:9000
      Storage__Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      Storage__Minio__AccessKey: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY must be set}
      Storage__Minio__SecretKey: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY must be set}
      Storage__Minio__UseSsl: ${MINIO_USE_SSL:-false}
      Storage__Minio__PublicUseSsl: ${MINIO_PUBLIC_USE_SSL:-false}
      Storage__Minio__UploadPresignExpirySeconds: ${MEDIA_UPLOAD_PRESIGN_EXPIRY_SECONDS:-900}
      Storage__Minio__ImageBucket: ${MINIO_IMAGE_BUCKET:-images}
      Storage__Minio__VideoBucket: ${MINIO_VIDEO_BUCKET:-videos}
      Storage__Minio__DocumentBucket: ${MINIO_DOCUMENT_BUCKET:-documents}
      Storage__Minio__AudioBucket: ${MINIO_AUDIO_BUCKET:-audios}
      Storage__Minio__OtherBucket: ${MINIO_OTHER_BUCKET:-other}
      Storage__Minio__HealthTimeoutSeconds: ${MINIO_HEALTH_TIMEOUT_SECONDS:-3}
      MediaThumbnail__MaxWidth: ${MEDIA_THUMBNAIL_MAX_WIDTH:-640}
      MediaThumbnail__MaxHeight: ${MEDIA_THUMBNAIL_MAX_HEIGHT:-640}
      MediaThumbnail__WebpQuality: ${MEDIA_THUMBNAIL_WEBP_QUALITY:-80}
      MediaThumbnail__VideoCapturePercent: ${MEDIA_THUMBNAIL_VIDEO_CAPTURE_PERCENT:-0.10}
      MediaThumbnail__VideoCaptureMinSeconds: ${MEDIA_THUMBNAIL_VIDEO_CAPTURE_MIN_SECONDS:-1}
      MediaThumbnail__VideoCaptureMaxSeconds: ${MEDIA_THUMBNAIL_VIDEO_CAPTURE_MAX_SECONDS:-30}
      MediaThumbnail__ProcessTimeoutSeconds: ${MEDIA_THUMBNAIL_PROCESS_TIMEOUT_SECONDS:-120}
      ServiceEndpoints__student-service: http://student-service:8080/
      ServiceEndpoints__admin-service: http://admin-service:8080/
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Notification/NotificationService.Api/NotificationService.Api.csproj
    command: NotificationService.Api.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *http-query-environment, *observability-environment]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      ConnectionStrings__Database: ${NOTIFICATION_DB_CONNECTION_STRING:?NOTIFICATION_DB_CONNECTION_STRING must be set}
      ServiceEndpoints__student-service: http://student-service:8080/
      ServiceEndpoints__media-service: http://media-service:8080/
    ports:
      - "5104:8080"

  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Notification/NotificationService.Worker/NotificationService.Worker.csproj
    command: NotificationService.Worker.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *http-query-environment, *observability-environment]
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: ${NOTIFICATION_DB_CONNECTION_STRING:?NOTIFICATION_DB_CONNECTION_STRING must be set}
      ServiceEndpoints__student-service: http://student-service:8080/
      Messaging__Consumer__ConcurrencyLimit: ${NOTIFICATION_BATCH_DISPATCH_CHUNK_CONCURRENCY:-1}
      NotificationBatchProcessing__DispatchChunkConcurrency: ${NOTIFICATION_BATCH_DISPATCH_CHUNK_CONCURRENCY:-1}
      NotificationBatchProcessing__MaxConcurrentSends: ${NOTIFICATION_BATCH_MAX_CONCURRENT_SENDS:-1}
      NotificationBatchProcessing__ClaimLeaseSeconds: ${NOTIFICATION_BATCH_CLAIM_LEASE_SECONDS:-120}
    restart: unless-stopped

  scheduler-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Scheduler/SchedulerService.Api/SchedulerService.Api.csproj
    command: SchedulerService.Api.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *observability-environment]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      ConnectionStrings__Database: ${SCHEDULER_DB_CONNECTION_STRING:?SCHEDULER_DB_CONNECTION_STRING must be set}
    ports:
      - "5105:8080"

  scheduler-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Scheduler/SchedulerService.Worker/SchedulerService.Worker.csproj
    command: SchedulerService.Worker.dll
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*messaging-environment, *http-query-environment, *observability-environment]
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ServiceEndpoints__notification-service: http://notification-service:8080/
      ServiceEndpoints__media-service: http://media-service:8080/

  admin-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/Admin/AdminService.Api/AdminService.Api.csproj
    command: AdminService.Api.dll
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      Admin__Ids__0: ${ADMIN_ID:-00000000-0000-0000-0000-000000000001}
      Admin__DisplayName: ${ADMIN_DISPLAY_NAME:-Development Admin}
    ports:
      - "5106:8080"

  data-seeder:
    profiles: ["seed"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Tools/Lms.DataSeeder/Lms.DataSeeder.csproj
    command: Lms.DataSeeder.dll --help
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      STUDENT_DB_CONNECTION_STRING: ${STUDENT_DB_CONNECTION_STRING:?STUDENT_DB_CONNECTION_STRING must be set}
      COURSE_DB_CONNECTION_STRING: ${COURSE_DB_CONNECTION_STRING:?COURSE_DB_CONNECTION_STRING must be set}
    restart: "no"

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Gateway/Lms.ApiGateway/Lms.ApiGateway.csproj
    command: Lms.ApiGateway.dll
    environment:
      <<: *observability-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Swagger__Enabled: ${Swagger__Enabled:-true}
      ServiceEndpoints__course-service: http://course-service:8080/
      ServiceEndpoints__student-service: http://student-service:8080/
      ServiceEndpoints__media-service: http://media-service:8080/
      ServiceEndpoints__notification-service: http://notification-service:8080/
      ServiceEndpoints__scheduler-service: http://scheduler-service:8080/
      ServiceEndpoints__admin-service: http://admin-service:8080/
      Proxy__MaxRequestBodySize: ${MEDIA_UPLOAD_REQUEST_MAX_BYTES:-550502400}
    ports:
      - "5100:8080"

volumes:
  mysql-data:
  minio-data:
  rabbitmq-data:
  seq-data:
